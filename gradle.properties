# --- JVM / build performance (tuned to stay within modest build machines) ---
# El compilador de Kotlin corre dentro del daemon (in-process), así que el heap es compartido:
# Reparto medido en esta máquina: el metaspace es el que se agota primero al compilar Compose (el
# plugin genera mucho código), así que se le da más que al heap. El total (heap + metaspace +
# overhead) tiene que quedar por debajo de ~1,35 GB o el kernel mata el daemon.
org.gradle.jvmargs=-Xmx576m -XX:MaxMetaspaceSize=576m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx512m
kotlin.compiler.execution.strategy=in-process
# 2 núcleos: más workers solo añaden contención de memoria.
# Límite conocido de esta máquina de desarrollo: el kernel mata cualquier proceso Java que pase de
# ~1.35 GB de RSS, y el worker de D8 que fusiona los dex se queda sin heap (~512 MB por defecto), así
# que :app:assembleDebug NO se puede empaquetar aquí. La compilación y los tests sí. El APK se
# empaqueta y se adjunta como artefacto en CI, que es donde tiene sentido hacerlo.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.enableR8.fullMode=true

# --- Kotlin ---
kotlin.code.style=official
