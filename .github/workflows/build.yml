name: Compilar y probar

on:
  push:
    branches: [main]
    # Las etiquetas v* despliegan: el trabajo "publicar" adjunta el APK al release de GitHub.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Núcleo + datos + tests de DSP
    runs-on: ubuntu-latest
    # Un test que se cuelga no debe dejar el pipeline colgado seis horas.
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Se instala el JDK de forma explícita en lugar de depender del runner: la versión queda
      # fijada por el workflow, no por la imagen que GitHub use ese día.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36 + build-tools 36.0.0)
        run: |
          set -eu
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sL -o cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # El gradle.properties del repo está ajustado a una máquina de 2 GB; aquí hay margen de sobra.
      # Se sobrescribe en el perfil del usuario para no tocar la configuración del proyecto.
      - name: Memoria del runner
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\n' > ~/.gradle/gradle.properties

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Versión (etiqueta o por defecto)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION_ARG=-PversionNameOverride=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Compilar y ejecutar los tests
        run: |
          chmod +x gradlew
          ./gradlew \
            :native:dsp:test \
            :domain:model:test \
            :core:designsystem:compileDebugKotlin \
            :core:database:compileDebugKotlin \
            :core:storage:compileDebugKotlin \
            :core:metadata:compileDebugKotlin \
            :core:permissions:compileDebugKotlin \
            :core:usb:compileDebugKotlin \
            :core:audio:compileDebugKotlin \
            :data:local:compileDebugKotlin \
            :data:metadata:compileDebugKotlin \
            :data:repository:compileDebugKotlin \
            :data:audio:compileDebugKotlin \
            :data:audio:testDebugUnitTest \
            :native:audio_engine:compileDebugKotlin \
            :presentation:library:compileDebugKotlin \
            :presentation:library:testDebugUnitTest \
            :presentation:playback:compileDebugKotlin \
            :presentation:playback:testDebugUnitTest \
            :presentation:settings:compileDebugKotlin \
            :presentation:settings:testDebugUnitTest \
            :presentation:navigation:compileDebugKotlin \
            :presentation:navigation:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease $VERSION_ARG \
            --console=plain

      # Antes de subir nada: ¿el APK puede arrancar? Un android:name que apunta a una clase que no
      # existe compila, se instala y se cierra al abrir; ningún compilador lo ve porque es una cadena.
      - name: Verificar los componentes del APK
        if: always()
        run: |
          set -eu
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            sh scripts/verify-apk.sh "$apk"
          done

      - name: Subir el APK de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifi-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Subir el APK de release (R8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifi-player-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Aquí se arranca la aplicación de verdad, con el manifest y los recursos reales, en dos
      # versiones de Android. Es la prueba que faltaba cuando la 0.17.0 se cerraba al abrir: encontró
      # la avería de la 0.17.1 (una llamada a ExoPlayer desde un hilo de fondo) el mismo día que se
      # escribió. Bloquea el pipeline a propósito: si el arranque se rompe, no se publica nada.
      - name: Pruebas de arranque de la app (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Guardar informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  # --------------------------------------------------------------------------------------------
  # La prueba que de verdad importa y que hasta ahora nadie hacía: instalar el APK **de release**
  # (el que se entrega, con R8) en un Android de verdad y comprobar que sigue vivo después de
  # abrirlo. Un APK que compila, se instala y se cierra al abrir es exactamente el fallo que se
  # escapó dos veces, porque ninguna comprobación estática lo ve.
  #
  # Bloquea a propósito: es la única comprobación que distingue «compila» de «funciona», y ya ha
  # demostrado que merece la pena (encontró el cierre al abrir de la 0.17.1 en su primera ejecución).
  # No bloquea la entrega: los trabajos que publican el APK y el panel dependen de `build`, no de este.
  # --------------------------------------------------------------------------------------------
  arranque:
    name: El APK de release abre de verdad (emulador)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el APK de release
        uses: actions/download-artifact@v4
        with:
          name: hifi-player-release-apk
          path: apk

      - name: Comprobar que hay un APK
        run: |
          set -eu
          ls -la apk
          ls apk/*.apk > /dev/null

      # El emulador necesita el grupo kvm accesible; sin esto arranca, pero a paso de tortuga.
      - name: Activar la aceleración por hardware
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Arrancar el emulador, instalar y abrir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: prueba-de-arranque
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # OJO: esta acción ejecuta cada línea en un shell independiente, así que no valen los
          # bloques de varias líneas (if/then/fi) ni un `set -e` que cruce de una línea a otra. Cada
          # línea tiene que valerse por sí sola.
          script: |
            adb install -r apk/app-release.apk
            adb shell am start -W -n com.hifiplayer/com.hifiplayer.ui.MainActivity
            sleep 20
            adb logcat -d > logcat.txt
            adb shell pidof com.hifiplayer > /dev/null && echo "OK: la aplicación sigue viva 20 s después de abrirla." || (echo "FALLO: la aplicación se cerró al abrir. Rastro de Android:" && adb logcat -d -b crash && adb logcat -d -s AndroidRuntime:E && exit 1)
            # Recorrido con capturas: hay fallos que solo se ven mirando (botones sin texto, avisos
            # pintados como errores, un tema que no cambia). No bloquea el pipeline todavía.
            python3 scripts/ui-walk.py ui-shots || echo "El recorrido de la interfaz encontró algo: mirar las capturas del artefacto."

      - name: Guardar el registro del sistema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-emulador
          path: logcat.txt
          if-no-files-found: ignore

      - name: Guardar las capturas de la interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: ui-shots/
          if-no-files-found: ignore

  # --------------------------------------------------------------------------------------------
  # Despliegue: al empujar una etiqueta v* (por ejemplo v0.5.0-alpha) se publica el APK de release
  # como release de GitHub. No hay tienda de por medio todavía, así que este es el canal de entrega.
  publicar:
    name: Publicar APK en el release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # El texto del release vive en docs/RELEASE-NOTES.md dentro del repositorio, así que hay que
      # traerlo: sin este paso el `body_path` no encuentra el archivo y la versión sale sin notas
      # (que es exactamente lo que pasó al publicar la 0.17.1).
      - name: Descargar el código (para las notas de la versión)
        uses: actions/checkout@v4

      - name: Descargar el APK de release
        uses: actions/download-artifact@v4
        with:
          name: hifi-player-release-apk
          path: apk

      # El APK de depuración se publica junto al de release a propósito: no lleva R8, así que
      # comparar los dos dice si un fallo viene de la minificación o del código.
      - name: Descargar el APK de depuración
        uses: actions/download-artifact@v4
        with:
          name: hifi-player-debug-apk
          path: apk-debug

      - name: Comprobar que hay un APK
        run: |
          set -eu
          ls -la apk
          count=$(ls apk/*.apk 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "La compilación no produjo ningún APK de release; no se publica nada." >&2
            exit 1
          fi

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          name: HiFi Player ${{ github.ref_name }}
          files: |
            apk/*.apk
            apk-debug/*.apk
          # Las versiones con -alpha/-beta se marcan como preliminares.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          body_path: docs/RELEASE-NOTES.md

  # --------------------------------------------------------------------------------------------
  # Panel de estado del proyecto. El repositorio tiene Pages configurado para desplegarse desde
  # Actions (no con el generador Jekyll), así que aquí se sube la carpeta docs/ tal cual: es HTML
  # plano, sin build ni dependencias.
  #
  # Además se copia ahí el APK de release: así hay un enlace de descarga directa que se puede abrir
  # desde el propio teléfono, sin entrar en GitHub, sin iniciar sesión y sin descomprimir nada.
  # --------------------------------------------------------------------------------------------
  paginas:
    name: Publicar el panel en GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Descargar el APK de release
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hifi-player-release-apk
          path: apk-pagina

      - name: Copiar el APK a docs/
        continue-on-error: true
        run: |
          set -eu
          ls -la apk-pagina
          VERSION=$(grep -o 'versionName = versionOverride ?: "[^"]*"' app/build.gradle.kts \
            | head -1 | sed 's/.*"\(.*\)"/\1/')
          cp apk-pagina/*.apk docs/hifi-player.apk
          cp apk-pagina/*.apk "docs/hifi-player-${VERSION}.apk"
          ls -la docs/*.apk

      - name: Empaquetar docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
