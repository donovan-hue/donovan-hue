name: Compilar y probar

on:
  push:
    branches: [main]
    # Las etiquetas v* despliegan: el trabajo "publicar" adjunta el APK al release de GitHub.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Núcleo + datos + tests de DSP
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Se instala el JDK de forma explícita en lugar de depender del runner: la versión queda
      # fijada por el workflow, no por la imagen que GitHub use ese día.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36 + build-tools 36.0.0)
        run: |
          set -eu
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sL -o cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # El gradle.properties del repo está ajustado a una máquina de 2 GB; aquí hay margen de sobra.
      # Se sobrescribe en el perfil del usuario para no tocar la configuración del proyecto.
      - name: Memoria del runner
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\n' > ~/.gradle/gradle.properties

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Versión (etiqueta o por defecto)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION_ARG=-PversionNameOverride=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Compilar y ejecutar los tests
        run: |
          chmod +x gradlew
          ./gradlew \
            :native:dsp:test \
            :core:designsystem:compileDebugKotlin \
            :core:database:compileDebugKotlin \
            :core:storage:compileDebugKotlin \
            :core:metadata:compileDebugKotlin \
            :core:permissions:compileDebugKotlin \
            :core:usb:compileDebugKotlin \
            :core:audio:compileDebugKotlin \
            :data:local:compileDebugKotlin \
            :data:metadata:compileDebugKotlin \
            :data:repository:compileDebugKotlin \
            :data:audio:compileDebugKotlin \
            :native:audio_engine:compileDebugKotlin \
            :presentation:playback:compileDebugKotlin \
            :presentation:navigation:compileDebugKotlin \
            :app:assembleDebug \
            :app:assembleRelease $VERSION_ARG \
            --console=plain

      - name: Subir el APK de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifi-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Subir el APK de release (R8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifi-player-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Guardar informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  # --------------------------------------------------------------------------------------------
  # Despliegue: al empujar una etiqueta v* (por ejemplo v0.5.0-alpha) se publica el APK de release
  # como release de GitHub. No hay tienda de por medio todavía, así que este es el canal de entrega.
  publicar:
    name: Publicar APK en el release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el APK de release
        uses: actions/download-artifact@v4
        with:
          name: hifi-player-release-apk
          path: apk

      - name: Comprobar que hay un APK
        run: |
          set -eu
          ls -la apk
          count=$(ls apk/*.apk 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "La compilación no produjo ningún APK de release; no se publica nada." >&2
            exit 1
          fi

      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          name: HiFi Player ${{ github.ref_name }}
          files: apk/*.apk
          # Las versiones con -alpha/-beta se marcan como preliminares.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          body: |
            APK de HiFi Player **${{ github.ref_name }}** (compilado con R8, minificado).

            **Qué funciona hoy (fases 1-5 del plan):** motor de audio Media3 con el DSP conectado,
            reproducción en primer plano con MediaSession, pantalla Now Playing con la información
            técnica medida, mini reproductor, navegación y cola de reproducción con reordenación
            por arrastre, guardado y restauración de la cola.

            **Qué todavía no:** la biblioteca no tiene pantalla (fase 6+), así que al abrir la app
            aún no hay de dónde elegir música; el ecualizador, ReplayGain, crossfeed, la selección
            de DAC USB y el modo bit-perfect están pendientes y la app los muestra como tales, sin
            botones decorativos.

            **Firma:** este APK se firma con la clave de depuración mientras no exista un keystore
            de producción configurado (`keystore.properties` o las variables `HIFI_*`). Es instalable,
            pero para publicar en una tienda hay que firmarlo con la clave definitiva.

            **Honestidad técnica:** ninguna cifra de calidad de audio se muestra si no se ha medido.
            El bit-perfect no se anuncia como activo hasta que el sistema lo confirme en el dispositivo.

  # --------------------------------------------------------------------------------------------
  # Panel de estado del proyecto. El repositorio tiene Pages configurado para desplegarse desde
  # Actions (no con el generador Jekyll), así que aquí se sube la carpeta docs/ tal cual: es HTML
  # plano, sin build ni dependencias.
  paginas:
    name: Publicar el panel en GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
